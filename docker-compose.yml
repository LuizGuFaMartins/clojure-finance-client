version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - AUTH_API_URL=${AUTH_API_URL}
        - API_URL=${API_URL}
        - NODE_ENV=production
    container_name: finance-client
    env_file:
      - .env
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

